name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      # The app ships inside the APK (webDir: dist), so build it first.
      # The APK calls the server of its own branch: dev → the dev preview, main → production.
      - name: Build web app
        run: npm run build
        env:
          VITE_WEB_ORIGIN: ${{ github.ref_name == 'main' && 'https://el-baul-de-los-jogos.vercel.app' || 'https://el-baul-de-los-jogos-git-dev-deus20.vercel.app' }}
      - name: Create Android project
        run: npm run android:add
      - name: Generate app icon and splash screen from assets/
        run: npm run android:icons
      - name: Sync Capacitor
        run: npm run android:sync
      # Android only installs an update when its versionCode is higher, so use the run number.
      - name: Set version number
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
      # Always the same key (stored as repository secrets), so every APK installs over the previous one.
      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: el-baul
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Faltan los secretos ANDROID_KEYSTORE_* del repositorio"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # apksigner lives in the Android build-tools, which are installed but not on the PATH.
          export PATH="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1):$PATH"
          npx cap build android --androidreleasetype APK --signing-type apksigner             --keystorepath "$RUNNER_TEMP/release.jks" --keystorepass "$KEYSTORE_PASSWORD"             --keystorealias "$KEY_ALIAS" --keystorealiaspass "$KEYSTORE_PASSWORD"
          rm -f "$RUNNER_TEMP/release.jks"
          ls android/app/build/outputs/apk/release
          # Capacitor leaves both the unsigned and the signed APK here: ship the signed one.
          cp android/app/build/outputs/apk/release/*-signed.apk el-baul-de-los-jogos.apk
      - name: Verify signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --verbose --print-certs el-baul-de-los-jogos.apk | grep -E 'Verifies|Verified using v[0-9]+ scheme.*true|certificate (DN|SHA-256 digest)'
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: el-baul-de-los-jogos-${{ github.ref_name }}-apk
          path: el-baul-de-los-jogos.apk
          if-no-files-found: error
          retention-days: 30
      # Google Play wants an Android App Bundle (AAB) signed with the same key (jarsigner,
      # since apksigner only signs APKs).
      - name: Build signed release AAB (Google Play)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: el-baul
        run: |
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          npx cap build android --androidreleasetype AAB --signing-type jarsigner \
            --keystorepath "$RUNNER_TEMP/release.jks" --keystorepass "$KEYSTORE_PASSWORD" \
            --keystorealias "$KEY_ALIAS" --keystorealiaspass "$KEYSTORE_PASSWORD"
          rm -f "$RUNNER_TEMP/release.jks"
          find android/app/build/outputs/bundle -name '*.aab' -print
          cp "$(find android/app/build/outputs/bundle/release -name '*signed*.aab' | head -1 || true)" el-baul-de-los-jogos.aab 2>/dev/null \
            || cp "$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)" el-baul-de-los-jogos.aab
          # jarsigner -verify exits 0 even for unsigned files: check its answer.
          jarsigner -verify el-baul-de-los-jogos.aab | tee verify.txt | tail -1
          grep -q "jar verified" verify.txt || { echo "::error::El AAB no está firmado"; exit 1; }
      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: el-baul-de-los-jogos-${{ github.ref_name }}-aab
          path: el-baul-de-los-jogos.aab
          retention-days: 30

  # Installs the APK on an Android emulator and takes screenshots online and offline,
  # to check the bundled app really starts (and doesn't need the network to show up).
  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: el-baul-de-los-jogos-${{ github.ref_name }}-apk
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install el-baul-de-los-jogos.apk
            adb install -r el-baul-de-los-jogos.apk
            adb shell am start -W -n es.sergioarroni.miludoteca/.MainActivity
            sleep 20
            adb exec-out screencap -p > launch-online.png
            adb shell am force-stop es.sergioarroni.miludoteca
            adb shell cmd connectivity airplane-mode enable
            adb shell am start -W -n es.sergioarroni.miludoteca/.MainActivity
            sleep 15
            adb exec-out screencap -p > launch-offline.png
            adb logcat -d -s Capacitor:* chromium:* > logcat.txt || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-screenshots-${{ github.ref_name }}
          path: |
            launch-online.png
            launch-offline.png
            logcat.txt
          retention-days: 14
