<style>
.overview{display:flex;align-items:center;gap:22px;margin:19px 0 5px;padding:13px 17px;border:1px solid var(--line);border-radius:13px;background:var(--paper)}.overview-item{display:flex;align-items:baseline;gap:7px}.overview-item strong{font-size:1.13rem}.overview-item span{color:var(--muted);font-size:.8rem}.overview-spacer{flex:1}.overview-divider{width:1px;height:24px;background:var(--line)}.theme-settings{width:min(340px,100%);padding:0}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:900px){.wrap{padding:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar .search{grid-column:1/-1}}
@media(max-width:640px){body{font-size:14px}.wrap{padding:12px 14px calc(88px + env(safe-area-inset-bottom))}.app-header{padding:5px 0 13px}.brand-mark{width:40px;height:40px;border-radius:13px}.brand-name{font-size:.9rem}.brand-caption{font-size:.7rem}.header-actions{gap:7px}.syncstatus{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.7rem}.profile-trigger{padding:3px}.profile-meta,.profile-trigger .chevron{display:none}.avatar{width:38px;height:38px}.profile-menu{position:fixed;top:calc(62px + env(safe-area-inset-top));right:12px;width:min(310px,calc(100vw - 24px))}.nav{position:fixed;z-index:20;right:0;bottom:0;left:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;margin:0;padding:7px 4px calc(7px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--nav-bg);box-shadow:0 -8px 24px #1119140c}.tab{min-width:0;min-height:55px;display:flex;flex-direction:column;gap:2px;padding:5px 2px;border-radius:9px;font-size:.64rem}.tab-icon{font-size:1.05rem;line-height:1.15}.sectionhead{align-items:flex-start;margin:8px 0 15px}.sectionhead h1,.sectionhead h2{font-size:1.75rem}.sectionhead p{font-size:.83rem}.sectionhead>.btn{width:auto;min-height:42px}.toolbar{grid-template-columns:1fr 1fr;gap:7px;margin:14px 0}.toolbar .search{grid-column:1/-1}.grid{grid-template-columns:1fr;gap:9px}.card,.groupcard{padding:14px;border-radius:13px}.cardfoot{gap:6px}.cardfoot button,.cardfoot a{min-height:42px}.formgrid{grid-template-columns:1fr;gap:11px}.field.full{grid-column:auto}.dialog{position:absolute;bottom:0;left:0;width:100%;max-height:92dvh;padding:20px 17px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0}.dialoghead{top:-20px;margin:-1px -1px 15px;padding:1px 1px 10px}.formactions{position:sticky;bottom:-18px;margin:16px -17px calc(-18px - env(safe-area-inset-bottom));padding:12px 17px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}.formactions .btn{flex:1}.profile-card{padding:16px}.footer{padding:18px 0 0}.placetable th,.placetable td{padding:10px 8px;font-size:.8rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

</html>
